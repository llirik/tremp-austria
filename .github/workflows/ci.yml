name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Exclude unused Chrome package source
        run: |
          # Playwright downloads its own Chromium. A broken runner Chrome APT
          # mirror must not block installation of Ubuntu's browser libraries.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -qE 'https?://dl\.google\.com/linux/chrome(-stable)?/deb' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
